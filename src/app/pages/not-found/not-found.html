<section class="flex-1 relative overflow-hidden bg-brand-text text-white py-32 flex flex-col justify-center items-center text-center">
  <!-- Brand Geometric Background -->
  <div class="absolute inset-0 opacity-10 pointer-events-none">
    <svg width="100%" height="100%">
      <pattern id="error-grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="2" fill="white"/>
      </pattern>
      <rect width="100%" height="100%" fill="url(#error-grid)"/>
    </svg>
  </div>

  <!-- Subtle Glows -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-primary/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="max-w-4xl mx-auto px-6 relative z-10">
    <span class="text-brand-primary font-bold tracking-widest uppercase text-sm mb-6 block font-display">
      {{ t().notFound.title }}
    </span>

    <h1 class="font-display font-bold text-5xl md:text-7xl lg:text-8xl mb-8 leading-tight">
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-primary to-brand-accent">
        {{ t().notFound.subtitle }}
      </span>
    </h1>

    <p class="text-white/70 text-xl md:text-2xl mb-12 max-w-2xl mx-auto font-body font-light leading-relaxed">
      {{ t().notFound.desc }}
    </p>

    <a routerLink="/"
       class="group inline-flex items-center gap-3 bg-white text-brand-primary rounded-full px-10 py-5 text-xl font-bold shadow-2xl hover:bg-brand-bg hover:scale-105 transition-all duration-300">
      {{ t().notFound.cta }}
      <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">home</span>
    </a>

    <!-- Decorative Logo Watermark -->
    <div class="mt-24 opacity-10 grayscale contrast-150">
      <img ngSrc="/offbeats-logo.png" alt="offbeats" height="40" width="280" class="h-8 w-auto mx-auto">
    </div>
  </div>
</section>
