<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-center bg-background-light/90 backdrop-blur-md">
  <div class="flex items-center justify-between w-full max-w-6xl px-4 py-3 md:px-10">
    <div class="flex items-center gap-2 font-bold text-xl">
      <img
        ngSrc="/offbeats-logo.png"
        alt="offbeats logo"
        width="600"
        height="160"
        priority
        class="h-6 md:h-8 w-auto min-w-[120px] md:min-w-[160px] shrink-0 object-contain cursor-pointer"
        [routerLink]="['/']"
        (click)="closeMobileMenu()"
      />
    </div>

    <div class="flex grow justify-end items-center gap-4 md:gap-8">
      <!-- Desktop nav -->
      <nav class="hidden md:flex items-center gap-9">
        <a [routerLink]="['/']" [fragment]="'what-we-do'"
           class="text-slate-600 hover:text-primary text-sm font-medium transition-colors cursor-pointer">
          {{ t().nav.whatWeDo }}
        </a>
        <a [routerLink]="['/']" [fragment]="'about-us'"
           class="text-slate-600 hover:text-primary text-sm font-medium transition-colors cursor-pointer">
          {{ t().nav.about }}
        </a>
      </nav>

      <!-- Language toggle stays visible -->
      <button (click)="ls.toggleLanguage()"
              class="text-xs font-bold uppercase border border-slate-300 rounded px-2 py-1 hover:bg-slate-100">
        {{ ls.currentLang() }}
      </button>

      <!-- Desktop contact -->
      <button
        [routerLink]="['contact']"
        class="hidden md:flex rounded-full h-10 px-4 bg-primary text-white text-sm font-bold items-center hover:bg-accent-2 transition-colors shadow-lg hover:shadow-primary/30">
        {{ t().nav.contact }}
      </button>

      <!-- Mobile burger -->
      <button type="button"
              class="md:hidden inline-flex items-center justify-center rounded-lg p-2 hover:bg-slate-100"
              (click)="toggleMobileMenu()"
              [attr.aria-expanded]="mobileMenuOpen()"
              aria-controls="mobile-menu"
              aria-label="Open menu">
        <span class="material-symbols-outlined text-slate-700">
          {{ mobileMenuOpen() ? 'close' : 'menu' }}
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile dropdown -->
  @if (mobileMenuOpen()) {
    <div class="absolute top-full left-0 right-0 border-t border-slate-200 bg-background-light/95 backdrop-blur-md"
         id="mobile-menu">
      <div class="max-w-6xl mx-auto px-4 md:px-10 py-4 flex flex-col gap-3">
        <a [routerLink]="['/']" [fragment]="'what-we-do'"
           (click)="closeMobileMenu()"
           class="py-2 text-slate-700 hover:text-primary font-medium">
          {{ t().nav.whatWeDo }}
        </a>

        <a [routerLink]="['/']" [fragment]="'about-us'"
           (click)="closeMobileMenu()"
           class="py-2 text-slate-700 hover:text-primary font-medium">
          {{ t().nav.about }}
        </a>

        <a [routerLink]="['contact']"
           (click)="closeMobileMenu()"
           class="mt-2 inline-flex items-center justify-center rounded-full h-11 px-5 bg-primary text-white text-sm font-bold hover:bg-accent-2 transition-colors">
          {{ t().nav.contact }}
        </a>
      </div>
    </div>
  }
</header>
