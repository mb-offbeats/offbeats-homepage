<section class="relative min-h-screen flex flex-col justify-center items-center text-center px-6 pt-20">
  <div class="absolute inset-0 bg-grid-pattern bg-[length:40px_40px] opacity-40 -z-10"></div>
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-brand-primary/5 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-brand-accent/5 rounded-full blur-3xl"></div>

  <div class="max-w-4xl relative z-10 animate-fade-in-up">
    <h1 class="font-display font-bold mb-6 text-brand-accent leading-[0.85]">
      <span class="text-7xl md:text-8xl lg:text-9xl block mb-2">offbeats</span>
      <span class="text-gradient text-4xl md:text-6xl lg:text-7xl">Software-Solutions</span>
    </h1>
    <p class="font-body text-xl md:text-2xl text-brand-text/80 mb-12 font-light">
      {{t().hero.subtitle}}
    </p>

    <div class="flex flex-col md:flex-row gap-4 justify-center">
      <a (click)="scroller.scrollTo('services-preview')"
         class="group flex items-center gap-2 bg-brand-primary text-white px-8 py-4 rounded-full font-bold shadow-xl shadow-brand-primary/30 hover:shadow-brand-primary/50 transition-all hover:-translate-y-1">
        {{t().hero.cta}}
        <span class="material-symbols-outlined group-hover:translate-y-1 transition-transform">arrow_downward</span>
      </a>
    </div>
  </div>
</section>
