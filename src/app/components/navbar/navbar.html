<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-center bg-white/90 backdrop-blur-md border-b border-brand-primary/10 transition-all duration-300 h-20 animate-hero-entry">

  <div class="flex items-center justify-between w-full max-w-7xl px-6 md:px-10 h-full">

    <div class="flex items-center gap-2 font-bold text-xl">
      <a [routerLink]="['/']" (click)="closeMobileMenu()" class="cursor-pointer">
        <img
          ngSrc="/offbeats-logo.png"
          alt="offbeats Software-Solutions GmbH"
          class="h-5 w-auto object-contain"
          height="254" width="1782"/>
      </a>
    </div>

    <div class="flex grow justify-end items-center gap-4 md:gap-8">

      <nav class="hidden md:flex items-center gap-8 font-body font-medium text-sm">
        <a [routerLink]="['/']" fragment="modernization" class="text-brand-text hover:text-brand-primary transition-colors cursor-pointer">
          {{ t().nav.modernization }}
        </a>
        <a [routerLink]="['/']" fragment="architecture" class="text-brand-text hover:text-brand-primary transition-colors cursor-pointer">
          {{ t().nav.architecture }}
        </a>
        <a [routerLink]="['/']" fragment="development" class="text-brand-text hover:text-brand-primary transition-colors cursor-pointer">
          {{ t().nav.development }}
        </a>

        <a [routerLink]="['/about']" routerLinkActive="text-brand-primary font-bold" class="text-brand-text hover:text-brand-primary transition-colors cursor-pointer">
          {{ t().nav.about }}
        </a>
      </nav>

      <button (click)="ls.toggleLanguage()"
              class="text-xs font-bold uppercase border border-gray-300 rounded px-2 py-1 hover:bg-gray-100 text-brand-text transition-colors">
        {{ ls.currentLang() }}
      </button>

      <a [routerLink]="['/contact']"
         class="hidden md:flex items-center justify-center bg-brand-primary text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-brand-dark transition-colors shadow-lg shadow-brand-primary/20 cursor-pointer">
        {{ t().nav.contact }}
      </a>

      <button type="button"
              class="md:hidden inline-flex items-center justify-center rounded-lg p-2 text-brand-text hover:bg-gray-100 transition-colors"
              (click)="toggleMobileMenu()"
              [attr.aria-expanded]="mobileMenuOpen()"
              aria-label="Toggle menu">
        <span class="material-symbols-outlined text-2xl">
          {{ mobileMenuOpen() ? 'close' : 'menu' }}
        </span>
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <div class="absolute top-20 left-0 right-0 border-b border-brand-primary/10 bg-white/95 backdrop-blur-xl shadow-xl md:hidden animate-fade-in-down">
      <div class="flex flex-col p-6 gap-4 font-body text-center">

        <a [routerLink]="['/']" fragment="modernization" (click)="closeMobileMenu()"
           class="py-2 text-brand-text hover:text-brand-primary font-medium border-b border-gray-100">
          {{ t().nav.modernization }}
        </a>

        <a [routerLink]="['/']" fragment="architecture" (click)="closeMobileMenu()"
           class="py-2 text-brand-text hover:text-brand-primary font-medium border-b border-gray-100">
          {{ t().nav.architecture }}
        </a>

        <a [routerLink]="['/']" fragment="development" (click)="closeMobileMenu()"
           class="py-2 text-brand-text hover:text-brand-primary font-medium border-b border-gray-100">
          {{ t().nav.development }}
        </a>

        <a [routerLink]="['/about']" (click)="closeMobileMenu()"
           class="py-2 text-brand-text hover:text-brand-primary font-medium border-b border-gray-100">
          {{ t().nav.about }}
        </a>

        <a [routerLink]="['/contact']" (click)="closeMobileMenu()"
           class="mt-4 w-full flex items-center justify-center bg-brand-primary text-white py-3 rounded-xl font-bold hover:bg-brand-dark transition-colors shadow-lg shadow-brand-primary/20">
          {{ t().nav.contact }}
        </a>
      </div>
    </div>
  }
</header>
