<section class="py-12 bg-brand-accent border-y border-white/10 overflow-hidden relative">
  <div class="absolute inset-0 opacity-10"
       style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 20px 20px;"></div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <div class="flex flex-wrap justify-center items-center gap-x-8 gap-y-4 md:justify-between">

      <div class="group cursor-default" appAnimateOnScroll animationDelay="0ms">
            <span
              class="font-display font-bold text-2xl md:text-4xl text-white tracking-tight group-hover:text-brand-primary transition-colors duration-300">
                {{ t().keywords.curious }}
            </span>
      </div>

      <span class="hidden md:block text-white/20 text-2xl">/</span>

      <div class="group cursor-default" appAnimateOnScroll animationDelay="100ms">
            <span
              class="font-display font-bold text-2xl md:text-4xl text-white tracking-tight group-hover:text-brand-primary transition-colors duration-300">
                {{ t().keywords.courageous }}
            </span>
      </div>

      <span class="hidden md:block text-white/20 text-2xl">/</span>

      <div class="group cursor-default" appAnimateOnScroll animationDelay="200ms">
            <span
              class="font-display font-bold text-2xl md:text-4xl text-white tracking-tight group-hover:text-brand-primary transition-colors duration-300">
                {{ t().keywords.untypical }}
            </span>
      </div>

      <span class="hidden md:block text-white/20 text-2xl">/</span>

      <div class="group cursor-default" appAnimateOnScroll animationDelay="300ms">
            <span
              class="font-display font-bold text-2xl md:text-4xl text-white tracking-tight group-hover:text-brand-primary transition-colors duration-300">
                {{ t().keywords.modern }}
            </span>
      </div>

      <span class="hidden md:block text-white/20 text-2xl">/</span>

      <div class="group cursor-default" appAnimateOnScroll animationDelay="400ms">
            <span
              class="font-display font-bold text-2xl md:text-4xl text-white tracking-tight group-hover:text-brand-primary transition-colors duration-300">
                {{ t().keywords.vibrant }}
            </span>
      </div>
    </div>
  </div>
</section>
