<section class="w-full flex justify-center py-16">
  <div class="w-full max-w-3xl px-4 md:px-10">
    <h1 class="text-4xl font-bold mb-12 text-center">{{ t().contactPage.title }}</h1>

    <div class="p-8 space-y-6">
      <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-primary">business</span>
        <div>
<!--          <h2 class="font-bold">{{ t().contactPage.companyName }}</h2>-->
          <h2 class="font-bold">offbeats Software-Solutions GmbH</h2>
<!--          <p class="text-slate-600">offbeats Software-Solutions GmbH</p>-->
        </div>
      </div>

      <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-primary">location_on</span>
        <div>
          <h2 class="font-bold">{{ t().contactPage.address }}</h2>
          <p class="text-slate-600">Thüringerberg 144<br>6721 Thüringerberg<br>Österreich</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-primary">mail</span>
        <div>
          <h2 class="font-bold">{{ t().contactPage.email }}</h2>
<!--          <a href="mailto:office@offbeats.at?subject=Anfrage&body=Hey%20offbeats-Team%2C%0A%0Alass%20uns%20gemeinsam%20etwas%20Gro%C3%9Fartiges%20starten!%20%F0%9F%9A%80" class="text-primary font-medium hover:underline">office@offbeats.at</a>-->
          <a [href]="'mailto:office@offbeats.at?subject=' + t().startProject.emailSubject + '&body=' + t().startProject.emailBody" class="text-primary font-medium hover:underline">office@offbeats.at</a>
        </div>
      </div>
    </div>
  </div>
</section>
