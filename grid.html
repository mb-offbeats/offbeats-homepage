<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Example</title>
</head>

<style>

    .grid-container {
        display: grid;

        /* grid-template-columns: 2fr 1fr; */

        /* grid-template-columns: repeat(4, 100px); */
        /* grid-template-rows: 200px 150px; 200px height for first row, 150 px height for second row */
        /* grid-auto-rows: 150px; */
        /* grid-template-rows: 200px;; */


        grid-template-columns: 200px 250px;
        grid-auto-rows: minmax(150px, auto);

        gap: 20px;

        /* grid-template-areas: "header header"; */

        /* grid-template-areas:
            "header header"
            "sidebar content"
            "sidebar content"
        ; */


        /* justify-content: center;
        align-content: center;
        height: 100vh; */

        justify-items: stretch;
        align-items: stretch;

    }

    .grid-item {
        border: 1px solid darkcyan;
    }

    .grid-item-1 {
        /* grid-area: header; */
        /* grid-column: 1 / -1; */
        /* grid-column: span 2; */
        
        align-self: start;
    }

    .grid-item-2 {
        /* grid-area: sidebar; */
        /* grid-row: 2 / 4; */
        grid-row: span 2;

        justify-self: center;
        align-self: center
    }

    .grid-item-3 {
        /* grid-area: content; */
        grid-row: span 1;

    }


/***************** GRID-Responsive ************************/

@import url('https://fonts.googleapis.com/css?family=Noto+Sans&display=swap');

body {
    background: rgb(19, 19, 19);
    color: #fff;
    font-family: 'Noto Sans', sans-serif;
}

    .card {
        display: flex;
        flex-direction: column;
        justify-content: cen;
        align-items: center;
        background: #353535;
        font-size: 3rem;
        color: #fff;
        height: 100%;
        width: 100%;
        border-radius: 4px;
        transition: all 500ms;
        overflow: hidden;

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .card:hover {
        box-shadow: rgba(2,8,20,0.1) 0px 0.35em 1.175em, rgba(2,8,20,0.08) 0px 1.175em 0.5em;
        transform: translateY(-3px) scale(1.1);
    }


    .basic-grid {
        display: grid;
        gap: 1rem;

        /* grid-template-columns: repeat(12, 1fr); */
        /* grid-template-columns: repeat(12, minmax(240px, 1fr)); */
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }


    .photo-grid {
        margin-top: 40px;
        display: grid;
        gap: 1rem;

        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        grid-auto-rows: 240px;

        .card {
            border: 1px solid white;
        }
    }



    /* only apply these classes if screen is wider than 600px*/
    @media screen and (min-width: 600px) {
        .card-tall {
            grid-row: span 2 / auto;
        }

        .card-wide {
            grid-column: span 2 / auto;
        }
    }

</style>
<body>
    
    <div class="grid-container">
        <div class="grid-item grid-item-1">Grid1</div>
        <div class="grid-item grid-item-2">grid2</div>
        <div class="grid-item grid-item-3">GridItem3</div>
        <div class="grid-item grid-item-4">GridItem4</div>
        <div class="grid-item grid-item-5">GridItem5</div>
    </div>  


    <section class="basic-grid">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
        <div class="card">7</div>
        <div class="card">8</div>
        <div class="card">9</div>
        <div class="card">10</div>
        <div class="card">11</div>
        <div class="card">12</div>
    </section>


    <section class="photo-grid">
        <div class="card card-tall">1</div>
        <div class="card card-wide">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
        <div class="card">7</div>
        <div class="card">8</div>
        <div class="card">9</div>
        <div class="card">10</div>
        <div class="card">11</div>
        <div class="card">12</div>
    </section>

</body>
</html>
